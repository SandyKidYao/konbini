<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ひかりマート 桜坂二丁目店</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
</head>
<body data-mode="day">
  <div id="stage"></div>

  <div class="veil" id="veil" aria-hidden="true"><p>开店准备中</p></div>

  <!-- the exhibit label that sits beside a model -->
  <aside class="label" aria-live="polite">
    <div class="label-stripe" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="label-body">
      <h1>ひかりマート</h1>
      <p class="label-sub">桜坂二丁目店</p>
      <dl>
        <div><dt>比例</dt><dd>1 : 150</dd></div>
        <div><dt>时刻</dt><dd id="labelTime">11:20</dd></div>
        <div><dt>天气</dt><dd id="labelWeather">晴，微风</dd></div>
      </dl>
    </div>
  </aside>

  <!-- scene switcher, styled after vending-machine selection buttons -->
  <nav class="selector" aria-label="切换场景">
    <button type="button" data-mode="day" aria-pressed="true" title="晴朗的白天（1）">
      <span class="lamp" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>
      <span class="name">晴朗的白天</span>
    </button>
    <button type="button" data-mode="overcast" aria-pressed="false" title="阴天的下午（2）">
      <span class="lamp" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 18.5h10.3a3.9 3.9 0 0 0 .5-7.8 5.6 5.6 0 0 0-10.8-1.2 4.5 4.5 0 0 0 0 9z"/></svg>
      <span class="name">阴天的下午</span>
    </button>
    <button type="button" data-mode="night" aria-pressed="false" title="雨夜（3）">
      <span class="lamp" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5a8.5 8.5 0 0 1 17 0z"/><path d="M12 11.5v6.8a1.9 1.9 0 0 1-3.8 0"/></svg>
      <span class="name">雨夜</span>
    </button>
  </nav>

  <div class="tools">
    <button type="button" id="spinBtn" aria-pressed="true" title="转台（R）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15.5" rx="8.5" ry="3.2"/><path d="M12 12.3V5"/><path d="M17.5 7.8 20 10.2l-3.1.6"/><path d="M20 10.2c-1.4-2.6-4.4-4.2-8-4.2"/></svg>
      <span class="sr">转台</span>
    </button>
    <button type="button" id="soundBtn" aria-pressed="false" title="声音（M）">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      <span class="sr">声音</span>
    </button>
  </div>

  <p class="hint" id="hint">拖动转一转，滚轮靠近看看。也可以点点小猫、店门和自动贩卖机。</p>
  <div class="tip" id="tip" role="status"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
