<style>
  :root {
    --panel: rgba(18, 22, 30, 0.42);
    --panel-border: rgba(255, 255, 255, 0.14);
    --text: #f3f5f8;
    --muted: rgba(243, 245, 248, 0.62);

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: var(--text);
    font-family: "Hiragino Sans", "PingFang SC", "Noto Sans JP", "Noto Sans SC", system-ui, sans-serif; }
  canvas { display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.35) 100%); }

  .brand { position: fixed; top: 20px; left: 22px; display: flex; gap: 12px; align-items: center;
    padding: 10px 16px 10px 12px; border-radius: 14px; background: var(--panel);
    border: 1px solid var(--panel-border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .brand .logo { width: 38px; height: 38px; border-radius: 9px; background: #fff; display: grid; place-items: center;
    box-shadow: inset 0 -5px 0 #ff8a1e, inset 0 -9px 0 #14a05a; }
  .brand .logo svg { width: 24px; height: 24px; margin-top: -6px; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: 0.12em; font-weight: 700; }
  .brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; }

  .clock { position: fixed; top: 20px; right: 22px; text-align: right; padding: 10px 16px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--panel-border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .clock .time { font-size: 26px; font-weight: 300; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .clock .weather { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; margin-top: 2px; }

  .dock { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    padding: 8px; border-radius: 18px; background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .dock button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px;
    font-size: 14px; color: var(--muted); transition: background 0.25s, color 0.25s, box-shadow 0.25s; white-space: nowrap; }
  .dock button svg { width: 18px; height: 18px; flex: none; }
  .dock button:hover { color: var(--text); background: rgba(255,255,255,0.07); }
  .dock button.active { color: #1b1d22; background: #fff; box-shadow: 0 4px 18px rgba(255,255,255,0.18); }
  .dock button.active[data-mode="day"] { background: #ffe9a8; }
  .dock button.active[data-mode="overcast"] { background: #dfe4ea; }
  .dock button.active[data-mode="night"] { background: #9fc2ff; }
  .dock .sep { width: 1px; height: 24px; background: var(--panel-border); margin: 0 4px; }
  .dock button.toggle.on { color: var(--text); background: rgba(255,255,255,0.12); }
  .dock kbd { font: 11px ui-monospace, monospace; opacity: 0.5; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }

  .hint { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); font-size: 12px; color: var(--muted);
    letter-spacing: 0.08em; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.5); transition: opacity 1s; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0e14; z-index: 10;
    transition: opacity 0.8s; font-size: 13px; letter-spacing: 0.2em; color: var(--muted); }
  #loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    .dock button span.label { display: none; }
    .dock kbd { display: none; }
    .brand p { display: none; }
    .clock { display: none; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// =====================================================================
//  Renderer / scene / camera
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2('#cfe3f0', 0.004);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 600);
camera.position.set(30, 18, 36);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2, 1.4, -2.5);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 14;
controls.maxDistance = 130;
controls.maxPolarAngle = 1.42;
controls.autoRotateSpeed = 0.45;
// optional ?cam=x,y,z,tx,ty,tz for a specific viewpoint
{
  const q = new URLSearchParams(location.search).get('cam');
  if (q) { const v = q.split(',').map(Number); if (v.length === 6 && v.every(Number.isFinite)) { camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); } }
}
controls.update();

// Cube camera — captures the scene for wet-ground / puddle / glass reflections
const envRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType });
const cubeCam = new THREE.CubeCamera(0.2, 300, envRT);
cubeCam.position.set(2, 0.45, 4.5);
scene.add(cubeCam);

// =====================================================================
//  Small utilities
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261012);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const JP = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
const LATIN = '"Avenir Next","Helvetica Neue",Arial,sans-serif';

function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// Scale BoxGeometry UVs so a repeating texture keeps a constant world size (unit metres per tile)
function worldUV(geo, w, h, d, unit) {
  const uv = geo.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    uv.setXY(i, uv.getX(i) * dims[f][0] / unit, uv.getY(i) * dims[f][1] / unit);
  }
  uv.needsUpdate = true;
  return geo;
}
function planarUV(geo) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox, p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    uv.setXY(i, (p.getX(i) - bb.min.x) / (bb.max.x - bb.min.x), (p.getY(i) - bb.min.y) / (bb.max.y - bb.min.y));
  }
  uv.needsUpdate = true;
  return geo;
}

function mat(color, o = {}) { return new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0, ...o }); }

// box with bottom at y
function box(parent, w, h, d, m, x, y, z, o = {}) {
  const geo = new THREE.BoxGeometry(w, h, d);
  if (o.uv) worldUV(geo, w, h, d, o.uv);
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y + h / 2, z);
  if (o.ry) mesh.rotation.y = o.ry;
  mesh.castShadow = o.cast ?? true;
  mesh.receiveShadow = o.recv ?? true;
  parent.add(mesh);
  return mesh;
}
// box by extents
function boxE(parent, x0, x1, y0, y1, z0, z1, m, o = {}) {
  return box(parent, x1 - x0, y1 - y0, z1 - z0, m, (x0 + x1) / 2, y0, (z0 + z1) / 2, o);
}
function cyl(parent, rt, rb, h, m, x, y, z, seg = 16, o = {}) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = o.cast ?? true;
  mesh.receiveShadow = o.recv ?? true;
  parent.add(mesh);
  return mesh;
}
const _up = new THREE.Vector3(0, 1, 0);
function rod(parent, a, b, r, m, seg = 8, cast = true) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), m);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(_up, dir.normalize());
  mesh.castShadow = cast;
  parent.add(mesh);
  return mesh;
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// Registries driven by the weather/time-of-day state
const glowMats = [];   // { mat, key, base }
function glow(m, key, base = 1) { glowMats.push({ mat: m, key, base }); return m; }
const wetMats = [];    // materials that darken / turn glossy when wet
function wetable(m) {
  wetMats.push({ mat: m, color: m.color.clone(), rough: m.roughness });
  m.envMap = envRT.texture;
  m.envMapIntensity = 0;
  return m;
}

// =====================================================================
//  Textures
// =====================================================================
const asphaltTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#5c5f64'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6; i++) {
    g.fillStyle = `rgba(35,37,42,${0.06 + rand() * 0.08})`;
    g.beginPath(); g.ellipse(rand() * w, rand() * h, 40 + rand() * 90, 25 + rand() * 60, rand() * 3, 0, 7); g.fill();
  }
  for (let i = 0; i < 11000; i++) {
    const v = (60 + rand() * 75) | 0, s = rand() * 2.2 + 0.6;
    g.fillStyle = `rgba(${v},${v},${v + 4},0.4)`;
    g.fillRect(rand() * w, rand() * h, s, s);
  }
  g.strokeStyle = 'rgba(28,28,30,0.45)'; g.lineWidth = 1.3;
  for (let i = 0; i < 5; i++) {
    let x = rand() * w, y = rand() * h; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 8; k++) { x += rr(-18, 18); y += rr(-18, 18); g.lineTo(x, y); }
    g.stroke();
  }
}, true);

const tileTex = canvasTex(256, 256, (g, w, h) => {
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = (176 + rand() * 18) | 0;
    g.fillStyle = `rgb(${v},${v - 4},${v - 10})`;
    g.fillRect(i * s, j * s, s, s);
  }
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(80,75,70,${rand() * 0.25})`; g.fillRect(rand() * w, rand() * h, 1.5, 1.5); }
  g.strokeStyle = 'rgba(95,90,84,0.75)'; g.lineWidth = 3;
  for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
}, true);

const concreteTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#a9a7a1'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { const v = (130 + rand() * 70) | 0; g.fillStyle = `rgba(${v},${v},${v - 4},0.35)`; g.fillRect(rand() * w, rand() * h, 1.6, 1.6); }
  g.strokeStyle = 'rgba(80,80,78,0.6)'; g.lineWidth = 2;
  g.strokeRect(1, 1, w - 2, h - 2);
}, true);

const floorTex = canvasTex(256, 256, (g, w, h) => {
  const n = 4, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = (232 + rand() * 12) | 0; g.fillStyle = `rgb(${v},${v},${v - 4})`; g.fillRect(i * s, j * s, s, s);
  }
  g.strokeStyle = 'rgba(160,160,155,0.8)'; g.lineWidth = 2;
  for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
}, true);

const blockTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8f8d87'; g.fillRect(0, 0, w, h);
  const bw = 128, bh = 64;
  for (let r = 0; r < 4; r++) for (let c = -1; c < 3; c++) {
    const v = (165 + rand() * 20) | 0;
    g.fillStyle = `rgb(${v},${v - 2},${v - 8})`;
    g.fillRect(c * bw + (r % 2) * 64 + 3, r * bh + 3, bw - 6, bh - 6);
  }
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(60,60,55,${rand() * 0.2})`; g.fillRect(rand() * w, rand() * h, 2, 2); }
}, true);

const storeWallTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#f1f0eb'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(150,150,145,0.45)'; g.fillRect(0, 0, 3, h); g.fillRect(128, 0, 3, h);
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(120,120,115,${rand() * 0.12})`; g.fillRect(rand() * w, rand() * h, 2, 2); }
}, true);

const sidingTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#c9c1b2'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) { g.fillStyle = 'rgba(90,80,70,0.35)'; g.fillRect(0, y, w, 3); g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(0, y + 3, w, 2); }
}, true);

const aptTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#d8cdbb'; g.fillRect(0, 0, w, h);
  const s = 32;
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const v = (205 + rand() * 18) | 0; g.fillStyle = `rgb(${v},${v - 10},${v - 26})`; g.fillRect(i * s + 1, j * s + 1, s - 2, s - 2);
  }
}, true);

const shutterTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#a7abb0'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 16) { g.fillStyle = '#7d8187'; g.fillRect(0, y, w, 3); g.fillStyle = '#c3c7cb'; g.fillRect(0, y + 4, w, 3); }
}, true);

const hedgeTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3f6b36'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) {
    const c = pick(['#2f5a2a', '#4f8240', '#5d9148', '#355f2f', '#6aa052']);
    g.fillStyle = c; g.beginPath(); g.arc(rand() * w, rand() * h, rr(2, 6), 0, 7); g.fill();
  }
}, true);

const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5b7c45'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = pick(['#4d6e3a', '#6a8d50', '#577a41', '#7a9a5a']); g.fillRect(rand() * w, rand() * h, 1.5, 4); }
}, true);

const poleStripeTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#f2c200'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1b1b1b';
  for (let i = -2; i < 4; i++) { g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32 + 16, 0); g.lineTo(i * 32 + 16 + 64, h); g.lineTo(i * 32 + 64, h); g.fill(); }
}, true);

const fanTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#dcdcd6'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3a3d42'; g.beginPath(); g.arc(78, 64, 46, 0, 7); g.fill();
  g.strokeStyle = '#9a9ea4'; g.lineWidth = 2;
  for (let r = 10; r < 46; r += 7) { g.beginPath(); g.arc(78, 64, r, 0, 7); g.stroke(); }
  g.beginPath(); g.moveTo(32, 64); g.lineTo(124, 64); g.moveTo(78, 18); g.lineTo(78, 110); g.stroke();
  g.fillStyle = '#b9bab4'; g.fillRect(8, 20, 14, 90);
});

function drawLogo(g, x, y, R) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#ff8a1e';
  g.beginPath();
  g.moveTo(0, -R); g.lineTo(R * 0.55, -R * 0.3); g.lineTo(R * 1.75, 0); g.lineTo(R * 0.55, R * 0.3);
  g.lineTo(0, R); g.lineTo(-R * 0.55, R * 0.3); g.lineTo(-R * 1.75, 0); g.lineTo(-R * 0.55, -R * 0.3);
  g.closePath(); g.fill();
  g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(0, 0, R * 0.5, R * 0.3, 0, 0, 7); g.fill();
  g.restore();
}

function makeSignTex(W, H) {
  return canvasTex(W, H, (g, w, h) => {
    g.fillStyle = '#fdfdf8'; g.fillRect(0, 0, w, h);
    const bw = h * 0.16;
    ['#14a05a', '#ff8a1e', '#2a6fd6'].forEach((c, i) => {
      g.fillStyle = c; g.fillRect(i * bw, 0, bw, h); g.fillRect(w - (i + 1) * bw, 0, bw, h);
    });
    drawLogo(g, w * 0.17, h * 0.5, h * 0.3);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#3c5d55';
    g.font = `600 ${h * 0.54}px ${JP}`; g.letterSpacing = `${h * 0.14}px`;
    g.fillText('ひかりマート', w * 0.54, h * 0.43);
    g.fillStyle = '#7d8e89';
    g.font = `600 ${h * 0.14}px ${LATIN}`; g.letterSpacing = `${h * 0.12}px`;
    g.fillText('HIKARI  MART', w * 0.54, h * 0.85);
  });

function vendTex(body, accent, emissive, seed) {

    const r = mulberry32(seed);
    const pk = (a) => a[Math.floor(r() * a.length)];
    g.fillStyle = emissive ? '#000' : body; g.fillRect(0, 0, w, h);
    g.fillStyle = emissive ? '#222' : accent; g.fillRect(0, 0, w, 40);
    if (!emissive) {
      g.fillStyle = '#fff'; g.font = `700 22px ${JP}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('つめた〜い', w / 2, 21);
    }
    g.fillStyle = emissive ? '#9fb2c6' : '#e4edf5'; g.fillRect(14, 48, w - 28, 276);
    for (let row = 0; row < 4; row++) {
      const y = 56 + row * 67;
      for (let c = 0; c < 7; c++) {
        const x = 22 + c * 31;
        g.fillStyle = pk(PROD_COLORS); g.fillRect(x, y, 22, 44);
        g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(x + 3, y + 4, 4, 36);
        g.fillStyle = '#c9c9c9'; g.fillRect(x + 6, y - 4, 10, 4);
        g.fillStyle = emissive ? '#ff6a3c' : (r() < 0.25 ? '#2b62d9' : '#e04030');
        g.fillRect(x + 3, y + 51, 16, 7);
      }

      g.fillStyle = '#2b2f36'; g.fillRect(166, 338, 70, 86);
      g.fillStyle = '#555'; g.fillRect(176, 352, 50, 8); g.fillRect(176, 372, 50, 4);

}

function pedTex(color, walking) {
  return canvasTex(64, 64, (g) => {
    g.fillStyle = '#0d0d0d'; g.fillRect(0, 0, 64, 64);
    g.fillStyle = color; g.strokeStyle = color; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.arc(32, 13, 6, 0, 7); g.fill();
    const L = (a, b, c, d) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke(); };
    if (!walking) { L(32, 22, 32, 40); L(32, 25, 23, 38); L(32, 25, 41, 38); L(32, 40, 27, 57); L(32, 40, 37, 57); }
    else { L(32, 22, 30, 40); L(31, 26, 20, 34); L(31, 26, 42, 31); L(30, 40, 19, 55); L(30, 40, 41, 54); }
  });
}

for (const [x0, x1, z0, z1] of SW) sheen(x0, x1, z0, z1, 0.156);

// =====================================================================
//  Lights
// =====================================================================
const hemi = new THREE.HemisphereLight('#ffffff', '#888888', 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 180 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const interiorLights = [V(-3.2, 2.45, -6.5), V(4.6, 2.45, -6.5), V(1, 2.45, -3.2)].map((p) => {
  const l = new THREE.PointLight('#f4f8ff', 10, 0, 2); l.position.copy(p); scene.add(l); return l;
});
const awningLight = new THREE.PointLight('#fff1dc', 0, 0, 1.8);
awningLight.position.set(1.5, 2.3, 0.4);
scene.add(awningLight);
const vendLight = new THREE.PointLight('#cfe6ff', 0, 8, 2);
vendLight.position.set(-10, 1.2, -0.3);
scene.add(vendLight);

// sky dome
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
  vertexShader: /* glsl */`varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: /* glsl */`uniform vec3 top, bottom; varying vec3 vDir;
    void main(){ float h = clamp(vDir.y, 0.0, 1.0); vec3 c = mix(bottom, top, pow(h, 0.42)); gl_FragColor = vec4(c, 1.0); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), skyMat);
sky.frustumCulled = false;
scene.add(sky);

// =====================================================================
//  Modes (weather + time of day) with smooth transitions
// =====================================================================
const MODES = {
  day: {
    skyTop: '#1f6fd6', skyBottom: '#a3cbee', fog: '#b5d3ee', fogDensity: 0.0022,
    hemiSky: '#cfe6ff', hemiGround: '#9c8a6c', hemi: 0.85,
    sunColor: '#ffe9c7', sun: 4.2, sunPos: [-34, 40, 18], shadow: 0.82, exposure: 1.02,
    sat: 1.14, contrast: 1.08, grade: '#fffaf0',
    sign: 0.75, interior: 0.75, vending: 0.6, window: 0, lamp: 0, signal: 1.6, head: 0.35,
    interiorLight: 9, awningLight: 0, vendLight: 0, lampLight: 0, headLight: 0,
    bloom: 0.12, bloomThr: 0.95, bloomRad: 0.3,
    rain: 0, wet: 0, cloudColor: '#ffffff', cloud: 1, petals: 1,
  },
  overcast: {
    skyTop: '#7a838e', skyBottom: '#b3b8bd', fog: '#b0b5ba', fogDensity: 0.006,
    hemiSky: '#d0d6dd', hemiGround: '#6f6c66', hemi: 1.05,
    sunColor: '#e6ddd2', sun: 0.6, sunPos: [-32, 30, 24], shadow: 0.25, exposure: 0.93,
    sat: 0.68, contrast: 0.94, grade: '#f2f6fa',
    sign: 1.25, interior: 1.1, vending: 1.0, window: 0.12, lamp: 0, signal: 2.0, head: 0.8,
    interiorLight: 13, awningLight: 4, vendLight: 1.5, lampLight: 0, headLight: 4,
    bloom: 0.2, bloomThr: 0.85, bloomRad: 0.4,
    rain: 0, wet: 0.12, cloudColor: '#a7adb4', cloud: 1, petals: 0.6,
  },
  night: {
    skyTop: '#05070c', skyBottom: '#1d2535', fog: '#1d2535', fogDensity: 0.0095,
    hemiSky: '#3d5078', hemiGround: '#121216', hemi: 0.45,
    sunColor: '#8ea6d8', sun: 0.3, sunPos: [-20, 40, -15], shadow: 0.5, exposure: 1.1,
    sat: 1.05, contrast: 1.05, grade: '#f0f4ff',
    sign: 0.8, interior: 1.5, vending: 1.2, window: 1.25, lamp: 2.5, signal: 2.6, head: 3,
    interiorLight: 20, awningLight: 12, vendLight: 4, lampLight: 90, headLight: 50,
    bloom: 0.5, bloomThr: 0.8, bloomRad: 0.4,
    rain: 1, wet: 1, cloudColor: '#1a1f28', cloud: 0, petals: 0,
  },
};
const MODE_INFO = {
  day: { time: '11:20', weather: '晴れ · 晴朗白天' },
  overcast: { time: '15:40', weather: 'くもり · 阴天午后' },
  night: { time: '23:10', weather: '雨 · 雨夜' },
};
const toVal = (v) => (typeof v === 'string' ? new THREE.Color(v) : Array.isArray(v) ? new THREE.Vector3(...v) : v);
const cloneVal = (v) => (typeof v === 'number' ? v : v.clone());
const TARGETS = {};
for (const m in MODES) { TARGETS[m] = {}; for (const k in MODES[m]) TARGETS[m][k] = toVal(MODES[m][k]); }
const cur = {};
for (const k in TARGETS.day) cur[k] = cloneVal(TARGETS.day[k]);
let from = null, to = TARGETS.day, tt = 1, currentMode = 'day';
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function setMode(m, instant = false) {
  if (!MODES[m]) return;
  currentMode = m;
  to = TARGETS[m];
  if (instant) { for (const k in to) cur[k] = cloneVal(to[k]); tt = 1; }
  else { from = {}; for (const k in cur) from[k] = cloneVal(cur[k]); tt = 0; }
  document.querySelectorAll('.dock button[data-mode]').forEach((b) => b.classList.toggle('active', b.dataset.mode === m));
  document.getElementById('clockTime').textContent = MODE_INFO[m].time;
  document.getElementById('clockWeather').textContent = MODE_INFO[m].weather;
  history.replaceState(null, '', location.search + '#' + m);
  envDirty = 40;
}
function stepTransition(dt) {
  if (tt >= 1) return;
  tt = Math.min(1, tt + dt / 2.4);
  const e = ease(tt);
  for (const k in cur) {
    if (typeof cur[k] === 'number') cur[k] = from[k] + (to[k] - from[k]) * e;
    else cur[k].copy(from[k]).lerp(to[k], e);
  }
}

// =====================================================================
//  Post-processing
// =====================================================================
const dbs = renderer.getDrawingBufferSize(new THREE.Vector2());
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(dbs.x, dbs.y, { type: THREE.HalfFloatType, samples: 4 }));
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.2, 0.4, 0.9);
composer.addPass(bloom);
const gradePass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSat: { value: 1 }, uContrast: { value: 1 }, uTint: { value: new THREE.Color(1, 1, 1) } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uSat, uContrast; uniform vec3 uTint; varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      float l = dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
      vec3 col = mix(vec3(l), c.rgb, uSat) * uTint;
      col = max(vec3(0.0), (col - 0.18) * uContrast + 0.18);
      gl_FragColor = vec4(col, c.a);
    }`,
});
composer.addPass(gradePass);
composer.addPass(new OutputPass());

function applyState(s) {
  skyMat.uniforms.top.value.copy(s.skyTop);
  skyMat.uniforms.bottom.value.copy(s.skyBottom);
  scene.fog.color.copy(s.fog);
  scene.fog.density = s.fogDensity;
  hemi.color.copy(s.hemiSky); hemi.groundColor.copy(s.hemiGround); hemi.intensity = s.hemi;
  sun.color.copy(s.sunColor); sun.intensity = s.sun;
  sun.position.copy(s.sunPos);
  sun.shadow.intensity = s.shadow;
  renderer.toneMappingExposure = s.exposure;
  for (const g of glowMats) g.mat.emissiveIntensity = g.base * s[g.key];
  for (const l of interiorLights) l.intensity = s.interiorLight;
  awningLight.intensity = s.awningLight;
  vendLight.intensity = s.vendLight;
  for (const l of lampLights) l.intensity = s.lampLight;
  headLight.intensity = s.headLight;
  gradePass.uniforms.uSat.value = s.sat; gradePass.uniforms.uContrast.value = s.contrast; gradePass.uniforms.uTint.value.copy(s.grade);
  bloom.strength = s.bloom; bloom.threshold = s.bloomThr; bloom.radius = s.bloomRad;
  rainMat.uniforms.uOpacity.value = s.rain * 0.26;
  splashMat.uniforms.uOpacity.value = s.rain * 0.5;
  wetUniforms.uRain.value = s.rain;
  rain.visible = splashes.visible = s.rain > 0.01;
  const pw = THREE.MathUtils.smoothstep(s.wet, 0.3, 1);
  puddleMat.uniforms.uStrength.value = pw * 0.95;
  sheenMat.uniforms.uStrength.value = pw * 0.55;
  puddles.visible = pw > 0.01;
  wetFX.visible = reflector.visible = pw > 0.01;
  for (const w of wetMats) {
    w.mat.roughness = THREE.MathUtils.lerp(w.rough, Math.min(w.rough, 0.3), s.wet);
    w.mat.color.copy(w.color).multiplyScalar(1 - 0.45 * s.wet);
    w.mat.envMapIntensity = s.wet * 0.35;
  }
  cloudMat.color.copy(s.cloudColor);
  cloudMat.opacity = s.cloud;
  clouds.visible = s.cloud > 0.01;
  petalMesh.visible = s.petals > 0.02;
}

// =====================================================================
//  Traffic signal cycle & car
// =====================================================================
const CYCLE = 22;
function signalState(t) {
  const c = t % CYCLE;
  const veh = c < 10 ? 'g' : c < 13 ? 'y' : 'r';
  let ped;
  if (c < 7.5) ped = 'g';
  else if (c < 10) ped = (Math.floor(c * 4) % 2 === 0) ? 'g' : 'off';
  else ped = 'r';
  return { veh, ped };
}
function updateSignals(t) {
  const { veh, ped } = signalState(t);
  const on = cur.signal;
  for (const k of ['g', 'y', 'r']) for (const m of signalLamps.veh[k]) m.emissiveIntensity = k === veh ? on : 0;
  for (const k of ['g', 'r']) for (const m of signalLamps.ped[k]) m.emissiveIntensity = k === ped ? on * 0.9 : 0;
  return veh;
}
function updateCar(dt, veh) {
  const STOP_X = 10.6, MAX = 8.5;
  let x = taxi.position.x;
  let desired = MAX;
  if (veh !== 'g' && x < STOP_X + 0.2 && x > STOP_X - 24) {
    const dist = STOP_X - x;
    const committed = veh === 'y' && dist < 4 && carV > 5;
    if (!committed) desired = Math.max(0, Math.min(MAX, dist * 0.9));
  }
  carV += (desired - carV) * Math.min(1, dt * (desired < carV ? 2.2 : 0.9));
  x += carV * dt;
  if (x > 33) x = -33;
  taxi.position.x = x;
  for (const w of wheels) w.rotation.z -= (carV * dt) / 0.34;
}

// =====================================================================
//  UI
// =====================================================================
document.querySelectorAll('.dock button[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
const rotateBtn = document.getElementById('rotateBtn');
rotateBtn.addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; rotateBtn.classList.toggle('on', controls.autoRotate); });
addEventListener('keydown', (e) => {
  if (e.key === '1') setMode('day');
  if (e.key === '2') setMode('overcast');
  if (e.key === '3') setMode('night');
  if (e.key.toLowerCase() === 'r') rotateBtn.click();
});
controls.addEventListener('start', () => { document.getElementById('hint').style.opacity = 0; });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  reflector.getRenderTarget().setSize(...reflSize());
  splashMat.uniforms.uPR.value = renderer.getPixelRatio();
});

// =====================================================================
//  Main loop
// =====================================================================
let envDirty = 40;
function captureEnv() {
  const hidden = [rain, splashes, wetFX, reflector];
  const vis = hidden.map((o) => o.visible);
  hidden.forEach((o) => (o.visible = false));
  renderer.shadowMap.autoUpdate = false;
  cubeCam.update(renderer, scene);
  renderer.shadowMap.autoUpdate = true;
  hidden.forEach((o, i) => (o.visible = vis[i]));
}

const initial = location.hash.slice(1);
setMode(MODES[initial] ? initial : 'day', true);
applyState(cur);

const clock = new THREE.Clock();
const dummy = new THREE.Object3D();
let frame = 0, elapsed = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  stepTransition(dt);
  applyState(cur);

  rainMat.uniforms.uTime.value = elapsed;
  splashMat.uniforms.uTime.value = elapsed;
  wetUniforms.uTime.value = elapsed;

  const veh = updateSignals(elapsed);
  updateCar(dt, veh);

  for (const c of clouds.children) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 90) c.position.x = -90;
  }
  if (petalMesh.visible) {
    for (let i = 0; i < PETALS; i++) {
      const pt = petals[i];
      pt.t += dt; pt.life += dt;
      if (pt.p.y > 0.12) {
        pt.p.x += (pt.v.x + Math.sin(pt.t * pt.w.x) * 0.4) * dt;
        pt.p.y += pt.v.y * dt;
        pt.p.z += (pt.v.z + Math.cos(pt.t * pt.w.z) * 0.3) * dt;
        pt.r.set(pt.t * pt.w.x, pt.t * pt.w.y, pt.t * pt.w.z);
      } else if (pt.life > 9) respawnPetal(pt, false);
      dummy.position.copy(pt.p);
      dummy.rotation.copy(pt.r);
      dummy.scale.setScalar(cur.petals);
      dummy.updateMatrix();
      petalMesh.setMatrixAt(i, dummy.matrix);
    }
    petalMesh.instanceMatrix.needsUpdate = true;
  }

  controls.update();

  if (envDirty > 0 ? frame % 6 === 0 : frame % 45 === 0) captureEnv();
  if (envDirty > 0) envDirty--;
  if (tt < 1) envDirty = Math.max(envDirty, 6);

  composer.render();
  frame++;
  if (frame === 2) document.getElementById('loading').classList.add('done');
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
