    <rect x="3.25" y="3.25" width="11.5" height="11.5" rx="1.5"/>
    <path d="M3.25 7.75H14.75"/>
    <rect x="6.25" y="10.25" width="5.5" height="4.5"/>
  </g>
</svg>
